spring:
  application:
    name: bds-backend
  # Cấu hình riêng của từng máy (mật khẩu email, khóa Cloudinary...). File này không commit.
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:bds_broker}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Schema do database/init/01_V1__init_schema.sql quyết định, cấm update/create
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    max-failed-logins: 5
    set-password-token-hours: 24
    reset-password-token-minutes: 30
    jwt:
      # Giá trị mặc định chỉ để chạy máy phát triển. Môi trường thật phải đặt biến JWT_SECRET (từ 32 ký tự).
      secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
      expiration-minutes: 1440   # Phiên đăng nhập 1 ngày
  cors:
    allowed-origins:
      - http://localhost:5173
  mail:
    from: ${MAIL_FROM:no-reply@realia.local}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
